<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FlexBudget</title>
  <meta name="description" content="A soft, flexible budget for variable income. Saved privately on your device — no account needed." />
  <meta name="theme-color" content="#f5efe6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FlexBudget" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="lights" aria-hidden="true"><svg id="garland" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1 class="logo">Flex<span>Budget</span></h1>
        <p class="greeting" id="greeting"></p>
      </div>
      <div class="month-switch" role="group" aria-label="Choose month">
        <button class="icon-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
        <div class="month-label">
          <span id="monthLabel"></span>
          <button class="link-btn" id="todayBtn" hidden>Back to this month</button>
        </div>
        <button class="icon-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button data-tab="income"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg><span>Income</span></button>
      <button data-tab="bills"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Bills</span></button>
      <button data-tab="categories"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg><span>Categories</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Settings</span></button>
    </nav>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <span class="sprig" aria-hidden="true">&#10086;</span>
      Saved privately on this device · no account needed
    </footer>
  </div>

  <button class="fab" id="fab" aria-label="Add money in or out">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">&times;</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
